spring.application.name=pathfinder-backend
server.port=8080

# Database credentials live in application-local.properties,
# which is ignored by Git so the password never reaches GitHub
spring.profiles.active=local

# Create/update tables automatically from the entity classes (fine for development)
spring.jpa.hibernate.ddl-auto=update

# Print the SQL queries in the console (helps while learning)
spring.jpa.show-sql=true

# Avoid keeping a DB connection open during view rendering
spring.jpa.open-in-view=false